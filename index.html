<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SV13 TCG — Spectator View</title>
  <link rel="stylesheet" href="styles/spectator.css?v=10">
</head>
<body>
  <div id="background" aria-hidden="true"></div>

  <div class="page">
    <main id="spectator-main">
      <div class="spectator-header">
        <h1>Spectator View</h1>
        <p id="spectator-status" class="status status--loading">Connecting to duel…</p>
        <p id="watching-count">Spectators Watching: 0</p>
      </div>

      <p id="turn-display" class="turn-display"></p>

      <div class="duel-container" id="duel-container" aria-live="polite">
        <section class="player" id="player2" aria-label="Player 2">
          <h2 id="player2-name">Player 2</h2>
          <div class="hp">HP: <span id="player2-hp">—</span></div>
          <div class="piles">
            Hand: <strong class="hand-count">—</strong> •
            Deck: <strong class="deck-count">—</strong> •
            Discard: <strong class="discard-count">—</strong>
          </div>
          <div class="field" id="player2-field" aria-label="Player 2 field"></div>
          <div class="hand" id="player2-hand" aria-label="Player 2 hidden hand"></div>
        </section>

        <section class="player" id="player1" aria-label="Player 1">
          <h2 id="player1-name">Player 1</h2>
          <div class="hp">HP: <span id="player1-hp">—</span></div>
          <div class="piles">
            Hand: <strong class="hand-count">—</strong> •
            Deck: <strong class="deck-count">—</strong> •
            Discard: <strong class="discard-count">—</strong>
          </div>
          <div class="field" id="player1-field" aria-label="Player 1 field"></div>
          <div class="hand" id="player1-hand" aria-label="Player 1 hidden hand"></div>
        </section>
      </div>
    </main>

    <aside id="chat-panel" aria-label="Spectator chat">
      <header class="chat-header">
        <div>
          <div class="chat-title">Live Chat</div>
          <div id="chat-identity" class="chat-identity">Spectating anonymously</div>
        </div>
        <div id="chat-presence" class="chat-presence">0 online</div>
      </header>

      <div id="chat-log" class="chat-log" role="log" aria-live="polite"></div>
      <div id="chat-typing" class="chat-typing" aria-live="polite"></div>

      <form id="chat-form" class="chat-form" autocomplete="off">
        <input id="chat-input" type="text" placeholder="Message the crowd…" maxlength="500" aria-label="Chat message">
        <button id="chat-send" type="submit">Send</button>
      </form>
    </aside>
  </div>

  <div id="joinToast" class="join-toast" role="status" aria-live="polite"></div>

  <div id="duelResult" class="duel-result" hidden>
    <div class="duel-result__card" role="dialog" aria-modal="true" aria-labelledby="duelResultTitle">
      <div class="duel-result__title" id="duelResultTitle">Duel Finished</div>
      <div class="duel-result__winner" id="duelResultWinner"></div>
      <div class="duel-result__reason" id="duelResultReason"></div>
      <button id="duelResultClose" class="duel-result__close" type="button">Close</button>
    </div>
  </div>

  <audio id="spec-bgm" src="audio/bg/Follow the Trail.mp3" muted playsinline loop preload="metadata"></audio>
  <button id="specAudioToggle" class="audio-toggle" type="button" aria-label="Play background music">🔇</button>
  <a id="hubBtn" class="hub-btn" href="https://sv13tcg.com/">↩ Return to HUB</a>

  <!-- Use the API service's own Socket.IO client so protocol versions stay aligned. -->
  <script src="https://api.sv13tcg.com/socket.io/socket.io.js"></script>
  <script src="scripts/spectatorview.js?v=10"></script>
  <script type="module" src="scripts/chatClient.js?v=10"></script>
</body>
</html>
